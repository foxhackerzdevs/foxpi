[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foxpi"
version = "0.1.0"
description = "High-precision terminal π explorer — Chudnovsky, Ramanujan, Machin, and BBP spigot algorithms."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
dependencies = []

[project.scripts]
foxpi = "cli:main"

[project.urls]
"Source" = "https://github.com/foxhackerzdevs/foxpi"

[tool.setuptools]
py-modules = ["cli"]
packages = ["core"]
